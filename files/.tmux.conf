# Style
teal_dark="#5f8787"
green="#ddeecc"
teal="#99bbaa"
gray_900="#0d0d0d"
gray_800="#404040"
gray_700="#888888"
gray_600="#999999"
gray_500="#aaaaaa"
gray_400="#c1c1c1"

# Mouse control
set -g mouse on

# Remap prefix to C-Space
unbind C-b
set-option -g prefix C-Space
bind-key C-Space send-prefix

# Split panes using | and -
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

# Reload config file
bind r source-file ~/.tmux.conf

# Navigate panes using ctrl+shift+arrow
set -s user-keys[0] "\033[9i"
set -s user-keys[1] "\033[9j"
set -s user-keys[2] "\033[9k"
set -s user-keys[3] "\033[9l"

bind-key -n User0  select-pane -U
bind-key -n User1  select-pane -L
bind-key -n User2  select-pane -D
bind-key -n User3  select-pane -R

# Status bar
set -g status-position top
set -g status-left-length 100
set -g status-style "bg=${teal},fg=${gray_900}"
set -g status-left "#[fg=${gray_900},bold]#S | "

# Misc
set -as terminal-features 'xterm*:hyperlinks'
